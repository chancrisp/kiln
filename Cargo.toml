[workspace]
resolver = "2"
members = ["crates/kiln-core", "crates/kiln-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
kiln-core = { path = "crates/kiln-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
