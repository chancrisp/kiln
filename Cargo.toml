[workspace]
resolver = "2"
members = ["crates/kiln-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
thiserror = "2"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
