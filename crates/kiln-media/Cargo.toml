[package]
name = "kiln-media"
description = "Kiln's in-process audio engine. No UI dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The quality harness (harness/): Kiln's lossy output against FFmpeg's.
harness = []

[[test]]
name = "harness"
path = "harness/main.rs"
harness = false
required-features = ["harness"]

[build-dependencies]
cc = "1"

[dependencies]
thiserror.workspace = true
rubato = { version = "0.16.2", default-features = false }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "alac", "flac", "vorbis", "wav", "aiff", "isomp4", "mkv", "ogg", "pcm"] }
libflac-sys = { version = "0.3.4", default-features = false, features = ["build-flac"] }
# vorbis_rs is held at 0.5.5 and the sys crates under it at the versions the
# lockfile has (aotuv_lancer_vorbis_sys 0.1.5, ogg_next_sys 0.1.4), as tested.
# The two sys crates are listed here only to hold them: a `cargo update` would
# otherwise move them.
vorbis_rs = { version = "=0.5.5", default-features = false }
aotuv_lancer_vorbis_sys = "=0.1.5"
ogg_next_sys = "=0.1.4"
opusic-sys = { version = "0.7.5", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
# Only so cargo builds lame_enc.dll next to the test binaries. The LGPL code is
# never part of kiln-media itself: mp3.rs loads the DLL at run time.
kiln-lame = { path = "../kiln-lame" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Named directly only because `#[implement]` (the COM IStream over a Rust File
# in mf/com.rs) expands to paths in `windows_core`. Same version as `windows`'s.
windows-core = "0.62"

[target.'cfg(windows)'.dev-dependencies]
# The video job's memory test reads the process's peak working set.
windows = { version = "0.62", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
