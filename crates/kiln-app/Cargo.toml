[package]
name = "kiln-app"
description = "The Kiln desktop app for Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "kiln-app"
path = "src/main.rs"

[features]
# Test hooks that are otherwise only in debug builds (the placement switch,
# `KILN_TEST_PLACE`, the stand-in drives and Documents, a slowed copy). The
# shipped build is made without it.
test-hooks = ["kiln-core/test-hooks"]

[dependencies]
kiln-core.workspace = true
kiln-media.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
# gen_icon renders assets/kiln-seal.svg. resvg brings its own tiny-skia
# (0.11), which the example uses for every size so one Pixmap type serves.
resvg = { version = "0.45", default-features = false }
ico = "0.6"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
