# Kiln format registry.
#
# [formats.<ext>] describes one file type. Extensions are lowercase, without
# the dot. `aliases` are other extensions that mean the same type; they are
# accepted on input and never used for output names.
#
# Backend-specific keys:
#   ffmpeg = [...]  arguments added before the output when FFmpeg writes this
#                   type. Each item is one argument; nothing goes through a shell.
#   pandoc = "..."  the name Pandoc uses for this type.
#   standalone      Pandoc writes a complete document, not a fragment.
#   libreoffice = "..."           LibreOffice's --convert-to value for writing
#                                 this type: an extension, optionally with
#                                 ":filter name:filter options".
#   libreoffice_infilter = "..."  LibreOffice's --infilter value for reading it.
#
# [[route]] says which backend converts `from` types to `to` types. Every
# from/to combination is a pair; identical types are skipped. Declaring the
# same pair twice, in one route or across routes, is an error at load time.

# --- Images -----------------------------------------------------------------

[formats.png]
kind = "image"

[formats.jpg]
kind = "image"
aliases = ["jpeg"]

[formats.webp]
kind = "image"

[formats.bmp]
kind = "image"

[formats.gif]
kind = "image"

[formats.tiff]
kind = "image"
aliases = ["tif"]

# --- Audio ------------------------------------------------------------------

[formats.wav]
kind = "audio"
ffmpeg = ["-c:a", "pcm_s16le"]

[formats.mp3]
kind = "audio"
ffmpeg = ["-c:a", "libmp3lame", "-q:a", "2"]

[formats.flac]
kind = "audio"
ffmpeg = ["-c:a", "flac"]

[formats.ogg]
kind = "audio"
aliases = ["oga"]
ffmpeg = ["-c:a", "libvorbis", "-q:a", "5"]

[formats.opus]
kind = "audio"
ffmpeg = ["-c:a", "libopus", "-b:a", "128k"]

[formats.m4a]
kind = "audio"
ffmpeg = ["-c:a", "aac", "-b:a", "192k"]

# --- Video ------------------------------------------------------------------

[formats.mp4]
kind = "video"
aliases = ["m4v"]
ffmpeg = ["-c:v", "libx264", "-pix_fmt", "yuv420p", "-crf", "23", "-c:a", "aac", "-b:a", "160k", "-movflags", "+faststart"]

[formats.mov]
kind = "video"
ffmpeg = ["-c:v", "libx264", "-pix_fmt", "yuv420p", "-crf", "23", "-c:a", "aac", "-b:a", "160k"]

[formats.mkv]
kind = "video"
ffmpeg = ["-c:v", "libx264", "-pix_fmt", "yuv420p", "-crf", "23", "-c:a", "libopus", "-b:a", "128k"]

[formats.webm]
kind = "video"
ffmpeg = ["-c:v", "libvpx-vp9", "-b:v", "0", "-crf", "33", "-row-mt", "1", "-c:a", "libopus", "-b:a", "128k"]

# --- Documents --------------------------------------------------------------

[formats.md]
kind = "document"
aliases = ["markdown"]
pandoc = "markdown"

[formats.html]
kind = "document"
aliases = ["htm"]
pandoc = "html"
standalone = true

[formats.docx]
kind = "document"
pandoc = "docx"
libreoffice = "docx:MS Word 2007 XML"

[formats.odt]
kind = "document"
pandoc = "odt"
libreoffice = "odt:writer8"

[formats.epub]
kind = "document"
pandoc = "epub"

[formats.rst]
kind = "document"
pandoc = "rst"

[formats.tex]
kind = "document"
pandoc = "latex"
standalone = true

[formats.rtf]
kind = "document"
pandoc = "rtf"
standalone = true
libreoffice = "rtf:Rich Text Format"

[formats.txt]
kind = "document"
pandoc = "plain"

# --- Office (LibreOffice) ---------------------------------------------------

[formats.doc]
kind = "document"
libreoffice = "doc:MS Word 97"

[formats.pdf]
kind = "document"
libreoffice = "pdf"

[formats.xlsx]
kind = "spreadsheet"
libreoffice = "xlsx:Calc MS Excel 2007 XML"

[formats.xls]
kind = "spreadsheet"
libreoffice = "xls:MS Excel 97"

[formats.ods]
kind = "spreadsheet"
libreoffice = "ods:calc8"

# Comma separated, double quotes only where needed, UTF-8 (76), starting at
# line 1, cells written as shown.
[formats.csv]
kind = "spreadsheet"
libreoffice = "csv:Text - txt - csv (StarCalc):44,34,76,1,,0,false,true,true"
libreoffice_infilter = "CSV:44,34,76,1"

[formats.pptx]
kind = "presentation"
libreoffice = "pptx:Impress MS PowerPoint 2007 XML"

[formats.ppt]
kind = "presentation"
libreoffice = "ppt:MS PowerPoint 97"

[formats.odp]
kind = "presentation"
libreoffice = "odp:impress8"

# --- Routes -----------------------------------------------------------------

[[route]]
backend = "image"
from = ["png", "jpg", "webp", "bmp", "gif", "tiff"]
to = ["png", "jpg", "webp", "bmp", "gif", "tiff"]

[[route]]
backend = "ffmpeg"
from = ["wav", "mp3", "flac", "ogg", "opus", "m4a"]
to = ["wav", "mp3", "flac", "ogg", "opus", "m4a"]

[[route]]
backend = "ffmpeg"
from = ["mp4", "mov", "mkv", "webm"]
to = ["mp4", "mov", "mkv", "webm", "wav", "mp3", "flac", "ogg", "opus", "m4a"]

[[route]]
backend = "pandoc"
from = ["md", "html", "docx", "odt", "epub", "rst", "tex"]
to = ["md", "html", "docx", "odt", "epub", "rst", "tex", "rtf", "txt"]

# LibreOffice takes the office pairs Pandoc can't do: legacy binary types,
# RTF as input, spreadsheets, slides and PDF output. Pandoc keeps the pairs
# it already has, such as DOCX to ODT.

[[route]]
backend = "libreoffice"
from = ["doc", "rtf"]
to = ["doc", "docx", "odt", "rtf", "pdf"]

[[route]]
backend = "libreoffice"
from = ["docx", "odt"]
to = ["doc", "pdf"]

[[route]]
backend = "libreoffice"
from = ["xlsx", "xls", "ods", "csv"]
to = ["xlsx", "xls", "ods", "csv", "pdf"]

[[route]]
backend = "libreoffice"
from = ["pptx", "ppt", "odp"]
to = ["pptx", "ppt", "odp", "pdf"]
