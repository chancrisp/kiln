name: Release

# Push a tag such as v0.1.0 to build the installer and portable ZIP and
# attach them to a draft GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.KILN_SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      # Signing is optional. Store a base64 .pfx in the KILN_SIGN_CERT_BASE64
      # secret and its password in KILN_SIGN_PASSWORD to turn it on.
      - name: Prepare signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.KILN_SIGN_CERT_BASE64 }}
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'kiln-sign.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT))
          "KILN_SIGN_CERT=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package
        shell: pwsh
        env:
          KILN_SIGN_PASSWORD: ${{ secrets.KILN_SIGN_PASSWORD }}
        run: ./packaging/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: kiln-packages
          path: |
            dist/*.msi
            dist/*.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/*.msi
            dist/*.zip
