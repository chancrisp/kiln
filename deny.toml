# cargo-deny: every crate Kiln builds with must carry a licence that may be
# combined with Kiln's own, GPL-3.0-or-later. Run `cargo deny check licenses`.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[licenses]
confidence-threshold = 0.93
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.0-or-later",
    "LGPL-3.0",
    "MPL-2.0",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[advisories]
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
