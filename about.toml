# cargo-about: THIRD_PARTY_LICENSES, with every crate's licence text, from
# Cargo.lock. Run .\packaging\licences.ps1 to regenerate it.
accepted = [
    "GPL-3.0-or-later",
    "LGPL-2.0-or-later",
    "LGPL-3.0",
    "MPL-2.0",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
